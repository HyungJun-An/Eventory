services:
  eventory-db:
    image: mysql:8.0
    container_name: eventory-db
    # 비밀번호는 루트 .env 에서 읽는다 (없으면 compose 가 바로 오류로 멈춤 — .env.example 참고)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: Eventory
      MYSQL_USER: EventoryUser
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
    ports:
      - "3307:3306"
    restart: unless-stopped
    healthcheck:
      # $$ → 컨테이너 안의 환경변수로 해석 (compose 파일에 비밀번호를 쓰지 않기 위함)
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uEventoryUser -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  eventory-server:
    build:
      context: ./eventory-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://eventory-db:3306/Eventory
      - SPRING_DATASOURCE_USERNAME=EventoryUser
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - EVENTORY_SEED_ENABLED=true   # 데모 데이터 자동 입력 (실서비스 배포 시 제거)
      # 서버 시크릿 — 루트 .env 에서 읽고, 없으면 compose 가 기동 전에 멈춘다
      - JWT_SECRET=${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      - QR_HMAC_SECRET=${QR_HMAC_SECRET:?.env 에 QR_HMAC_SECRET 을 설정하세요}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:?.env 에 SSL_KEYSTORE_PASSWORD 를 설정하세요}
      # PortOne 결제 키 — 루트 .env 에서 읽는다 (.env.example 참고, 실제 값은 커밋 금지). .env 가 없으면 빈 값
      - PORTONE_STORE_ID=${PORTONE_STORE_ID:-}
      - PORTONE_CHANNEL_KEY=${PORTONE_CHANNEL_KEY:-}
      - PORTONE_V2_SECRET=${PORTONE_V2_SECRET:-}
      - PORTONE_WEBHOOK_SECRET=${PORTONE_WEBHOOK_SECRET:-}
      - PORTONE_CHANNEL_TYPE=${PORTONE_CHANNEL_TYPE:-TOSSPAY}   # 채널 종류 (TOSSPAY | KAKAOPAY | TOSSPAYMENTS_CARD | INICIS_CARD)
      # QR 메일 발송 계정 (Gmail + 앱 비밀번호) — 루트 .env 에서 읽는다. MAIL_FROM 을 비우면 MAIL_USERNAME 사용
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      eventory-db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  eventory-client:
    build:
      context: ./eventory-client
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - eventory-server   # Nginx가 기동 시 upstream(eventory-server) 이름을 해석하므로 먼저 떠 있어야 함
    restart: always

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: redis-server
    ports:
      - "6380:6379"
    restart: unless-stopped
