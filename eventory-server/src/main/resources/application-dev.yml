server:
  port: 8080

qr:
  secret: ${QR_HMAC_SECRET}   # QR 토큰 HMAC 서명키 (기본값 change-me 로는 누구나 입장 QR 위조 가능)
  mail-from: ${MAIL_FROM:}   # 비우면 메일 계정(MAIL_USERNAME) 주소로 발송
  issuer: Eventory

eventory:
  seed:
    enabled: true   # 기동 시 db/demo-data.sql 실행 (expo 테이블이 비어 있을 때만)

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always

spring:
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  redis:
    host: 124.62.17.42
    port: 6380
  mail:
    host: smtp.gmail.com
    port: 587
    # 메일 계정은 환경변수로만 주입한다 (로컬 실행 시 루트 .env 를 자동으로 읽는다)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/Eventory
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: EventoryUser
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.boot.actuate.endpoint: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG

jwt:
  # 서명키는 환경변수로만 주입 (없으면 기동 실패). 로컬 실행 시 루트 .env 를 자동으로 읽는다 (application.yml)
  secret: ${JWT_SECRET}
  access-token-validity: 900000      # 15분
  refresh-token-validity: 604800000  # 7일

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  override-with-generic-response: false

portone:
  api-base-url: https://api.portone.io
  # 결제 키는 코드에 두지 않고 환경변수로만 주입한다 (로컬 실행 시 루트 .env 를 자동으로 읽는다)
  v2-secret: ${PORTONE_V2_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  # 채널 종류(PG·결제수단) → 결제창 파라미터 전략 선택: TOSSPAY | KAKAOPAY | TOSSPAYMENTS_CARD | INICIS_CARD
  channel-type: ${PORTONE_CHANNEL_TYPE:TOSSPAY}

