spring:
  profiles:
    active: dev
  # 로컬 실행(IDE·mvn spring-boot:run) 시 루트 .env 를 설정으로 읽는다 (KEY=VALUE 형식이라 properties 로 해석 가능)
  # docker 에서는 파일이 없으므로 optional 로 무시되고, compose 가 넘긴 환경변수를 쓴다
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    hikari:
      # 행 락 대기 상한 3초 (MySQL 기본 50초).
      # JPA 힌트 jakarta.persistence.lock.timeout 은 Hibernate MySQL 방언이 SQL 에 반영하지 않아
      # "SELECT ... FOR UPDATE" 가 최대 50초 대기했다 → 커넥션 생성 시 세션 변수로 제한한다.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3
