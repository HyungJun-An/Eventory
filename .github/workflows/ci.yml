# 푸시할 때마다 백엔드 테스트(단위 + Testcontainers 통합)와 프론트 빌드를 실행한다.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연속 푸시하면 이전 실행은 취소
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test (JDK 21 · MySQL/Redis Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eventory-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 테스트는 application-test.yml 로 동작하므로 .env·시크릿이 필요 없다 (Docker 는 러너에 기본 제공)
      - name: Test
        run: mvn -B -ntp test

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            eventory-server/target/surefire-reports
            eventory-server/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eventory-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eventory-client/package-lock.json

      - run: npm ci
      - run: npm run build
